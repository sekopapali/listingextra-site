<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get in touch &mdash; ListingExtra</title>
<meta name="description" content="Get in touch with ListingExtra for early access, plan questions, or a walkthrough of the live pipeline.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #11131A; font-family: 'Public Sans', sans-serif; color: #EDEFF4; }
  .display { font-family: 'Space Grotesk', sans-serif; }
  a { color: #2A8AFF; text-decoration: none; }
  a:hover { color: #5BAEFF; }
  .btn-primary {
    background: linear-gradient(135deg, #3B9BFF, #0A5FE0); color: #FFFFFF; border: 1px solid rgba(120,170,255,0.5);
    box-shadow: 0 4px 20px rgba(42,138,255,0.3), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-primary:hover { background: linear-gradient(135deg, #5BAEFF, #1A6FF2); }
  .card {
    border: 1px solid #2A3040; border-radius: 10px;
    background: linear-gradient(165deg, #1C202C 0%, #171A23 60%, #12151D 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; }
  nav .links { display: flex; align-items: center; gap: 32px; font-size: 14px; font-weight: 500; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field input, .field select, .field textarea {
    background: #0D0F15; border: 1px solid #262A35; border-radius: 6px; padding: 11px 14px;
    font-size: 14px; color: #EDEFF4; font-family: 'Public Sans', sans-serif; width: 100%;
  }
  .field input::placeholder, .field textarea::placeholder { color: #495066; }
  .field label { font-size: 12px; color: #6B7080; }
  @media (max-width: 860px) { nav .links { display: none; } }
</style>
</head>
<body>
<div class="wrap">

  <!-- NAV -->
  <nav style="display: flex; align-items: center; justify-content: space-between; padding: 24px 24px; border-bottom: 1px solid #262A35;">
    <a href="index.html" class="brand">
      <svg width="26" height="26" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="24" height="24" rx="7" stroke="#2A8AFF" stroke-width="2.2"/>
        <path d="M8 14.5L12 18.5L20 9.5" stroke="#2A8AFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="display" style="font-size: 20px; font-weight: 700; color: #EDEFF4;">ListingExtra</div>
      <svg width="58" height="32" viewBox="0 0 58 32" style="margin-left: 2px;" aria-hidden="true">
        <g transform="translate(2 4) rotate(-16 24 12)">
          <rect x="0"  y="0"  width="13" height="13" fill="#3B82F6"/>
          <rect x="13" y="0"  width="13" height="13" fill="#F2F4F8"/>
          <rect x="0"  y="13" width="13" height="13" fill="#F2F4F8"/>
          <rect x="13" y="13" width="13" height="13" fill="#3B82F6"/>
          <rect x="30" y="10" width="9" height="9" fill="#3B82F6" opacity="0.85"/>
          <rect x="41" y="7"  width="6" height="6" fill="#5B6B85" opacity="0.7"/>
          <rect x="50" y="10" width="3.5" height="3.5" fill="#3B82F6" opacity="0.5"/>
        </g>
      </svg>
    </a>
    <div class="links">
      <a href="index.html#features">Features</a>
      <a href="index.html#pricing">Pricing</a>
      <a href="index.html#how">How it works</a>
      <a href="index.html#login">Log in</a>
      <a href="index.html#login" class="btn-primary" style="padding: 10px 20px; border-radius: 6px; font-weight: 600;">Start Free</a>
    </div>
  </nav>

  <!-- CONTACT -->
  <section style="padding: 64px 24px; display: flex; justify-content: center;">
    <div style="width: 100%; max-width: 920px;">
      <div style="text-align: center; margin-bottom: 40px;">
        <h1 class="display" style="font-size: 36px; font-weight: 700; margin: 0 0 12px;">Get in touch</h1>
        <p style="font-size: 16px; color: #AEB4C2; margin: 0;">Early access, plan questions, or a live walkthrough &mdash; drop a note and I'll reply personally.</p>
      </div>

      <div class="card" style="padding: 0; overflow: hidden; display: flex; flex-wrap: wrap;">

        <!-- form side -->
        <div style="flex: 1 1 420px; min-width: 0; padding: 36px;">
          <form action="https://formsubmit.co/hello@listingextra.com" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
            <input type="hidden" name="_subject" value="New message from listingextra.com">
            <input type="hidden" name="_template" value="box">
            <input type="hidden" name="_captcha" value="false">

            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" placeholder="Your name" required>
            </div>
            <div class="field">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" placeholder="you@yourshop.com" required>
            </div>
            <div class="field">
              <label for="topic">What's this about?</label>
              <select id="topic" name="topic">
                <option>Early access request</option>
                <option>Silver plan</option>
                <option>Gold plan</option>
                <option>Platinum plan</option>
                <option>General question</option>
              </select>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="4" placeholder="Tell me a bit about your shop and what you're looking for." required></textarea>
            </div>
            <button type="submit" class="btn-primary" style="border: none; cursor: pointer; padding: 13px; border-radius: 6px; font-weight: 600; font-size: 15px; font-family: 'Public Sans', sans-serif;">Send message</button>
          </form>
        </div>

        <!-- direct contact side -->
        <div style="flex: 1 1 280px; min-width: 0; background: #0D0F15; padding: 36px; border-left: 1px solid #262A35; display: flex; flex-direction: column; justify-content: center; gap: 20px;">
          <div>
            <div style="font-size: 12px; color: #6B7080; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;">Prefer email?</div>
            <button type="button" onclick="copyEmail(this)" style="background: none; border: none; padding: 0; cursor: pointer; font-family: 'Public Sans', sans-serif; font-size: 16px; font-weight: 600; color: #2A8AFF; display: flex; align-items: center; gap: 8px;">
              <span>hello@listingextra.com</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2" stroke="#2A8AFF" stroke-width="1.8"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" stroke="#2A8AFF" stroke-width="1.8"/></svg>
            </button>
            <div style="font-size: 12px; color: #495066; margin-top: 4px;">Click to copy</div>
          </div>
          <div style="height: 1px; background: #262A35;"></div>
          <div>
            <div style="font-size: 12px; color: #6B7080; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;">Response time</div>
            <div style="font-size: 14px; color: #C8CDD6;">Usually within one business day &mdash; it's a one-person team right now.</div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <footer style="padding: 24px; border-top: 1px solid #262A35; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 13px; color: #6B7080;">
    <div>&copy; 2026 ListingExtra</div>
    <div style="display: flex; gap: 24px;">
      <button type="button" onclick="copyEmail(this)" style="background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; font-size: 13px; color: #6B7080;">hello@listingextra.com</button>
    </div>
  </footer>

</div>
<script>
  function copyEmail(el) {
    try {
      navigator.clipboard.writeText('hello@listingextra.com');
      var original = el.innerHTML;
      var span = el.querySelector('span') || el;
      var prev = span.textContent;
      span.textContent = 'Copied!';
      setTimeout(function () { span.textContent = prev; }, 1500);
    } catch (e) {}
  }
  try {
    var topic = new URLSearchParams(window.location.search).get('topic');
    if (topic) {
      var select = document.getElementById('topic');
      for (var i = 0; i < select.options.length; i++) {
        if (select.options[i].text === topic) { select.selectedIndex = i; break; }
      }
    }
  } catch (e) {}
</script>
</body>
</html>
